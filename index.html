<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UFOキャッチャー</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Rounded Mplus 1c",sans-serif;
  background:linear-gradient(180deg,#ffe6f2 0%,#e6f3ff 45%,#e8fbe6 100%);
  color:#3b3350;overscroll-behavior:none;user-select:none;
  display:flex;justify-content:center;
}
#app{width:100%;max-width:500px;padding:10px 10px 24px;display:flex;flex-direction:column;gap:10px}

/* ---- えらぶ画面 ---- */
.title{text-align:center;margin:8px 0 2px}
.title h1{margin:0;font-size:30px;letter-spacing:2px;color:#ff6fa5;text-shadow:0 3px 0 #fff,0 5px 10px rgba(255,111,165,.35)}
.title p{margin:6px 0 0;font-size:14px;color:#7a7090}
.picks{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.pick{
  border:none;border-radius:26px;padding:16px 18px;display:flex;align-items:center;gap:14px;
  background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.08),0 10px 24px rgba(0,0,0,.10);
  cursor:pointer;transition:transform .08s;
}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.pick canvas{width:74px;height:74px;flex:none}
.pick .tx{text-align:left}
.pick .tx b{display:block;font-size:22px}
.pick .tx span{font-size:13px;color:#8a80a0}

/* ---- ゲーム画面 ---- */
.bar{display:flex;align-items:center;gap:8px}
.bar .sp{flex:1}
.chip{
  border:none;background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:bold;
  color:#5b5273;box-shadow:0 3px 0 rgba(0,0,0,.08);cursor:pointer;font-family:inherit
}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip.zu{background:#ffd76a}
canvas#stage{width:100%;display:block;border-radius:22px;box-shadow:0 10px 26px rgba(80,60,120,.22)}

.msg{
  min-height:34px;text-align:center;font-size:19px;font-weight:bold;color:#ff6fa5;
  display:flex;align-items:center;justify-content:center
}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  border:none;border-radius:20px;padding:16px 4px;font-size:19px;font-weight:bold;font-family:inherit;
  color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .06s
}
.btn:active,.btn.on{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.r{background:linear-gradient(180deg,#63c2ff,#2f9ce0)}
.btn.l{background:linear-gradient(180deg,#9fd76a,#6fb63c)}
.btn.go{grid-column:1/3;background:linear-gradient(180deg,#ff8fb8,#ff5c95);font-size:24px;padding:20px 4px}
.btn[disabled]{filter:grayscale(.6);opacity:.55}

section[hidden]{display:none !important}
.chip.fs{background:#c9c0f5;color:#463a7a}

/* ---- たてむきで せの ひくい がめん：はみ出さないよう つめる ---- */
@media (orientation:portrait) and (max-height:860px){
  canvas#stage{width:min(100%,calc((100vh - 215px) * 480 / 660));
               width:min(100%,calc((100dvh - 215px) * 480 / 660));margin:0 auto}
  #app{gap:7px;padding:6px 8px 12px}
  .msg{min-height:26px;font-size:17px}
  .btn{padding:12px 4px;font-size:17px}
  .btn.go{padding:15px 4px;font-size:21px}
  .chip{padding:6px 11px;font-size:13px}
}

/* ---- よこながタブレット ---- */
@media (orientation:landscape){
  body{align-items:center}
  #app{max-width:1250px;height:100vh;height:100dvh;padding:8px 12px;gap:8px}
  #select{display:flex;flex-direction:column;justify-content:center;flex:1;min-height:0}
  .title h1{font-size:34px}
  .picks{flex-direction:row;gap:18px}
  .pick{flex:1;flex-direction:column;text-align:center;padding:18px 10px}
  .pick canvas{width:88px;height:88px}
  .pick .tx{text-align:center}
  #game{display:grid;grid-template-columns:auto minmax(230px,430px);justify-content:center;
        grid-template-rows:auto 1fr;column-gap:18px;row-gap:8px;
        flex:1;min-height:0;height:100%}
  #game .bar{grid-column:2;grid-row:1;align-self:start;flex-wrap:wrap}
  #game .bar .sp{display:none}
  canvas#stage{grid-column:1;grid-row:1 / 3;height:calc(100vh - 20px);height:calc(100dvh - 20px);
        width:auto;max-width:100%;justify-self:start}
  #game .side{grid-column:2;grid-row:2;display:flex;flex-direction:column;
        justify-content:center;gap:14px;min-width:0}
  .msg{font-size:22px;min-height:52px}
  .btn{padding:20px 4px;font-size:21px}
  .btn.go{padding:30px 4px;font-size:28px}
  .sheetIn{max-height:96vh;border-radius:22px;margin:2vh 0}
  .grid{grid-template-columns:repeat(6,1fr)}
}

/* ---- ずかん ---- */
.sheet{position:fixed;inset:0;background:rgba(60,45,80,.45);display:flex;justify-content:center;align-items:flex-end;z-index:20}
.sheet[hidden]{display:none}
.sheetIn{
  width:100%;max-width:500px;background:#fffdf7;border-radius:26px 26px 0 0;padding:16px 14px 24px;
  max-height:88vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)
}
.sheetIn h2{margin:2px 0 4px;font-size:22px;text-align:center;color:#ff8c3a}
.prog{text-align:center;font-size:14px;color:#8a80a0;margin-bottom:10px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;border:none;border-radius:14px;padding:10px 0;font-family:inherit;font-weight:bold;font-size:15px;
  background:#efe9ff;color:#7a6fa0;cursor:pointer}
.tab.sel{background:#ffb36b;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cell{border:none;background:#fff;border-radius:16px;padding:6px 2px 7px;box-shadow:0 3px 0 rgba(0,0,0,.07);
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.cell:active{transform:translateY(3px);box-shadow:none}
.cell canvas{width:100%;height:auto}
.cell span{font-size:10.5px;line-height:1.2;color:#5b5273;word-break:keep-all}
.cell.locked{background:#eee9f2;box-shadow:none}
.cell.locked span{color:#b3abc4}
.voiceTest{display:block;width:100%;margin-top:14px;border:none;border-radius:16px;padding:12px;
  background:#ffd76a;color:#6b4e12;font-size:15px;font-weight:bold;font-family:inherit;cursor:pointer}
.voiceNote{min-height:18px;text-align:center;font-size:12.5px;color:#c2574d;margin-top:6px}
.closeBtn{display:block;width:100%;margin-top:10px;border:none;border-radius:18px;padding:14px;
  background:#7e6fd8;color:#fff;font-size:17px;font-weight:bold;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="app">

  <section id="select">
    <div class="title">
      <h1>UFOキャッチャー</h1>
      <p>どれを とる？</p>
    </div>
    <div class="picks" id="picks"></div>
  </section>

  <section id="game" hidden>
    <div class="bar">
      <button class="chip" id="back">← もどる</button>
      <div class="sp"></div>
      <button class="chip zu" id="openZu">ずかん <b id="cnt">0</b></button>
      <button class="chip fs" id="fs">⛶ ぜんがめん</button>
      <button class="chip fs" id="exitFs" hidden>↩ もとにもどす</button>
    </div>
    <canvas id="stage"></canvas>
    <div class="side">
      <div class="msg" id="msg">ボタンで うごかしてね</div>
      <div class="pad">
        <button class="btn l" id="bL">◀ ちょうせい</button>
        <button class="btn r" id="bR">みぎへ ▶</button>
        <button class="btn go" id="bGo">これに する！</button>
      </div>
    </div>
  </section>

</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheetIn">
    <h2>ずかん</h2>
    <div class="prog" id="prog"></div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
    <button class="voiceTest" id="voiceTest">🔊 こえを ためす</button>
    <div class="voiceNote" id="voiceNote"></div>
    <button class="closeBtn" id="closeZu">とじる</button>
  </div>
</div>

<script>
/* ============ おもちゃの データ ============ */
const SETS = {

    {n:'クワガタ',     y:'くわがた',     k:'beetle', c:'#4a4442', c2:'#8a817c', jaw:1},
    {n:'テントウムシ', y:'てんとうむし', k:'beetle', c:'#e2483f', c2:'#ffd9d2', pat:'dots'},

    {n:'モンシロチョウ',y:'もんしろちょう',k:'fly',  c:'#e8dcc6', c2:'#f6eede', wing:'big', wc:'#ffffff', wdot:'#4a4442'},

    {n:'カマキリ',     y:'かまきり',     k:'slim',   c:'#8ccf5a', c2:'#e0f4c8', leg:'scythe'},
    {n:'カタツムリ',   y:'かたつむり',   k:'snail',  c:'#e2d3b8', c2:'#f2e9d8', shell:'#c98b4e'}
  ]},
  kyoryu: { label:'きょうりゅう', sub:'ティラノ・トリケラ・ステゴ…12しゅるい', bg:['#ffe6cf','#cfe8ff'], list:[

    {n:'アロサウルス',     y:'あろさうるす',     k:'thero', c:'#b5563f', c2:'#f0c6b6'},
    {n:'ヴェロキラプトル', y:'べろきらぷとる',   k:'thero', c:'#d98cae', c2:'#ffdfea', pat:'stripes'},
    {n:'スピノサウルス',   y:'すぴのさうるす',   k:'thero', c:'#4fa596', c2:'#cdf0e8', sail:1},
    {n:'パラサウロロフス', y:'ぱらさうろろふす', k:'thero', c:'#e2c14e', c2:'#fbf1c2', orni:1, crest:1},
    {n:'イグアノドン',     y:'いぐあのどん',     k:'thero', c:'#79c0a8', c2:'#d9f2ea', orni:1},
    {n:'ブラキオサウルス', y:'ぶらきおさうるす', k:'sauro', c:'#9a86d4', c2:'#e4dcf8'},
    {n:'トリケラトプス',   y:'とりけらとぷす',   k:'quad',  c:'#7bb86f', c2:'#dcf1d3', frill:1, horns:1, beak:1},
    {n:'ステゴサウルス',   y:'すてごさうるす',   k:'quad',  c:'#6ea8d8', c2:'#d3ebfa', plate:1, smallhead:1, spike:1},
    {n:'アンキロサウルス', y:'あんきろさうるす', k:'quad',  c:'#9d8f6b', c2:'#e6dcc0', club:1, spikes:1},

    {n:'モササウルス',     y:'もささうるす',     k:'marine',c:'#5b7fd4', c2:'#cfdcfa'}
  ]},
  tokage: { label:'トカゲ', sub:'ヤモリ・カメレオン・イグアナ…12しゅるい', bg:['#e3f6e0','#ffeecf'], list:[
    {n:'ヤモリ',           y:'やもり',           k:'liz', v:'gecko',  c:'#8fc98a', c2:'#e4f3de', pads:1},
    {n:'カメレオン',       y:'かめれおん',       k:'liz', v:'chame',  c:'#5fc2a6', c2:'#d4f2e8', crestback:1, pat:'dots'},
    {n:'グリーンイグアナ', y:'ぐりーんいぐあな', k:'liz', v:'iguana', c:'#5aa84f', c2:'#cfe9c4', crestback:1, dewlap:1},
    {n:'フトアゴヒゲトカゲ',y:'ふとあごひげとかげ',k:'liz',v:'beardy',c:'#e0a25c', c2:'#fae2c3', beard:1, spikeside:1},
    {n:'コモドオオトカゲ', y:'こもどおおとかげ', k:'liz', v:'komodo', c:'#8b8578', c2:'#d2cdc1', tongue:'#e05a6a', bulk:1},
    {n:'エリマキトカゲ',   y:'えりまきとかげ',   k:'liz', v:'frill',  c:'#c98a4a', c2:'#f5dcb8', frill:1},
    {n:'アオジタトカゲ',   y:'あおじたとかげ',   k:'liz', v:'blue',   c:'#93877a', c2:'#dad1c6', tongue:'#5a7de0', bulk:1, pat:'stripes'},
    {n:'ヒョウモントカゲモドキ', y:'ひょうもんとかげもどき', k:'liz', v:'leopa', c:'#f2d46a', c2:'#fdf4ca', pat:'spots'},
    {n:'カナヘビ',         y:'かなへび',         k:'liz', v:'plain',  c:'#a9955f', c2:'#e8dcb8'},
    {n:'バシリスク',       y:'ばしりすく',       k:'liz', v:'basi',   c:'#4fb0c9', c2:'#cbeef6', headcrest:1, crestback:1},
    {n:'アルマジロトカゲ', y:'あるまじろとかげ', k:'liz', v:'armor',  c:'#b5714a', c2:'#eec6a8', spikeside:1, crestback:1},
    {n:'ニホントカゲ',     y:'にほんとかげ',     k:'liz', v:'skink',  c:'#6d7fc9', c2:'#d1d9f5', pat:'stripes'}
  ]}
};

/* ============ えがく どうぐ ============ */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function el(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,Math.PI*2);g.closePath();}
function shade(hex,k){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r*k)));gg=Math.max(0,Math.min(255,Math.round(gg*k)));b=Math.max(0,Math.min(255,Math.round(b*k)));
  return '#'+((1<<24)+(r<<16)+(gg<<8)+b).toString(16).slice(1);
}
function eye(g,x,y,e){
  g.fillStyle='#2b2b3a'; el(g,x,y,e,e*1.1,0); g.fill();
  g.fillStyle='#fff'; el(g,x-e*0.28,y-e*0.42,e*0.36,e*0.38,0); g.fill();
}
function blush(g,x,y,w){ g.fillStyle='rgba(255,140,170,.45)'; el(g,x,y,w,w*0.62,0); g.fill(); }
function smile(g,x,y,w){ g.strokeStyle='#2b2b3a'; g.lineWidth=Math.max(1.1,w*0.5); g.lineCap='round';
  g.beginPath(); g.moveTo(x-w,y); g.quadraticCurveTo(x,y+w*1.3,x+w,y); g.stroke(); }
function tri(g,x,y,w,h){ g.beginPath(); g.moveTo(x-w,y); g.lineTo(x,y-h); g.lineTo(x+w,y); g.closePath(); g.fill(); }

/* ---- むし：こうちゅう（カブト・クワガタ・テントウ・ダンゴ） ---- */
function bug_beetle(g,s,r){
  const d=shade(s.c,.66), h=shade(s.c,.82);
  g.strokeStyle=d; g.lineWidth=r*0.1; g.lineCap='round';
  [-0.5,-0.12,0.3].forEach(ly=>{ [-1,1].forEach(sx=>{
    g.beginPath(); g.moveTo(sx*r*0.28,r*ly);
    g.quadraticCurveTo(sx*r*0.88,r*ly,sx*r*0.96,r*(ly+0.4)); g.stroke(); }); });
  g.fillStyle=h; el(g,0,r*0.2,r*0.8,r*0.84,0); g.fill();
  g.fillStyle=s.c; el(g,0,r*0.22,r*0.72,r*0.76,0); g.fill();
  if(s.seg){
    g.save(); el(g,0,r*0.22,r*0.72,r*0.76,0); g.clip();
    g.strokeStyle=shade(s.c,.74); g.lineWidth=r*0.07;
    for(let i=-1;i<=4;i++){ g.beginPath(); g.moveTo(-r,r*0.2+i*r*0.22); g.lineTo(r,r*0.2+i*r*0.22); g.stroke(); }
    g.restore();
  } else {
    g.strokeStyle=shade(s.c,.58); g.lineWidth=r*0.06;
    g.beginPath(); g.moveTo(0,-r*0.48); g.lineTo(0,r*0.94); g.stroke();
  }
  if(s.pat==='dots'){ g.fillStyle='#2b2b3a';
    [[-.36,.02],[.36,.02],[-.3,.5],[.3,.5],[0,.28]].forEach(p=>{ el(g,p[0]*r,p[1]*r,r*0.12,r*0.12,0); g.fill(); }); }
  g.fillStyle=h; el(g,0,-r*0.52,r*0.5,r*0.26,0); g.fill();
  g.fillStyle=d; el(g,0,-r*0.8,r*0.42,r*0.3,0); g.fill();
  if(s.horn){
    g.fillStyle=shade(s.c,.5);
    g.beginPath();
    g.moveTo(-r*0.15,-r*0.9); g.lineTo(-r*0.12,-r*1.14);
    g.lineTo(-r*0.4,-r*1.46); g.lineTo(-r*0.18,-r*1.46);
    g.lineTo(0,-r*1.26);
    g.lineTo(r*0.18,-r*1.46); g.lineTo(r*0.4,-r*1.46);
    g.lineTo(r*0.12,-r*1.14); g.lineTo(r*0.15,-r*0.9);
    g.closePath(); g.fill();
  } else if(s.jaw){
    g.strokeStyle=shade(s.c,.46); g.lineWidth=r*0.13; g.lineCap='round';
    [-1,1].forEach(sx=>{ g.beginPath(); g.moveTo(sx*r*0.3,-r*0.9);
      g.bezierCurveTo(sx*r*0.92,-r*1.0,sx*r*0.88,-r*1.46,sx*r*0.3,-r*1.5); g.stroke();
      g.lineWidth=r*0.07;
      g.beginPath(); g.moveTo(sx*r*0.78,-r*1.28); g.lineTo(sx*r*0.5,-r*1.2); g.stroke();
      g.lineWidth=r*0.13; });
  } else {
    g.strokeStyle=shade(s.c,.55); g.lineWidth=r*0.07; g.lineCap='round';
    [-1,1].forEach(sx=>{ g.beginPath(); g.moveTo(sx*r*0.2,-r*0.96);
      g.quadraticCurveTo(sx*r*0.46,-r*1.12,sx*r*0.34,-r*1.2); g.stroke();
      g.fillStyle=shade(s.c,.55); el(g,sx*r*0.34,-r*1.22,r*0.09,r*0.08,0); g.fill(); });
  }
  eye(g,-r*0.17,-r*0.82,r*0.11); eye(g,r*0.17,-r*0.82,r*0.11);
  blush(g,-r*0.33,-r*0.66,r*0.1); blush(g,r*0.33,-r*0.66,r*0.1);
  smile(g,0,-r*0.66,r*0.08);
}

/* ---- むし：はねもの（チョウ・ハチ・セミ・トンボ） ---- */
function bug_fly(g,s,r){
  const d=shade(s.c,.72), wc=s.wc||'#ffffff', long=(s.wing==='dragon');
  g.fillStyle=wc; g.strokeStyle='rgba(110,105,150,.45)'; g.lineWidth=1.4;
  g.globalAlpha=(long?.8:.95);
  if(s.wing==='big'){
    [-1,1].forEach(sx=>{ el(g,sx*r*0.72,-r*0.4,r*0.66,r*0.52,sx*0.42); g.fill(); g.stroke();
                         el(g,sx*r*0.58,r*0.42,r*0.48,r*0.4,-sx*0.34); g.fill(); g.stroke(); });
    if(s.wdot){ g.fillStyle=s.wdot; g.globalAlpha=.55;
      [-1,1].forEach(sx=>{ el(g,sx*r*0.98,-r*0.62,r*0.12,r*0.12,0); g.fill();
                           el(g,sx*r*0.68,-r*0.2,r*0.08,r*0.08,0); g.fill(); }); g.globalAlpha=.95; }
  } else if(long){
    [-1,1].forEach(sx=>{ el(g,sx*r*0.74,-r*0.34,r*0.78,r*0.15,sx*0.1); g.fill(); g.stroke();

let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}} if(AC.state==='suspended')AC.resume(); return AC; }
function beep(f,dur,type,vol,delay){
  const c=ac(); if(!c)return;
  const t=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.15,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03);
}
const sTick =()=>beep(1046,.04,'square',.04);
const sDown =()=>{beep(180,.5,'sawtooth',.05);beep(360,.5,'sine',.03);};

/* ============ よみあげ ============ */
/* iPad/iPhone の Safari は「ユーザーが触った流れの中で1回 speak する」まで声を出さない。
   さらに getVoices() は遅れて埋まる。なので ①最初のタップで無音を1回しゃべって解錠
   ②声の一覧が来たら選び直す ③しゃべる直前に resume() を叩く、の3つを入れている。 */
let jaVoice=null, speechOK=false;
function pickVoice(){
  if(!window.speechSynthesis)return;
  let vs=[];
  try{ vs=speechSynthesis.getVoices()||[]; }catch(e){ return; }
  vs=vs.filter(v=>/^ja/i.test(v.lang||'')||/ja[-_]JP/i.test(v.lang||'')||/japanese|日本語/i.test(v.name||''));
  if(!vs.length)return;
  const rank=n=>{n=(n||'').toLowerCase();
    if(n.includes('kyoko'))return 0; if(n.includes('o-ren')||n.includes('oren'))return 1;
    if(n.includes('otoya'))return 2; if(n.includes('google'))return 3;
    if(n.includes('hattori')||n.includes('sayaka'))return 4;
    if(n.includes('拡張')||n.includes('premium')||n.includes('enhanced'))return 5; return 6;};
  vs.sort((a,b)=>rank(a.name)-rank(b.name));
  jaVoice=vs[0];
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.addEventListener?speechSynthesis.addEventListener('voiceschanged',pickVoice):speechSynthesis.onvoiceschanged=pickVoice;
  setTimeout(pickVoice,400); setTimeout(pickVoice,1500);
}
function unlockSpeech(){
  if(speechOK||!window.speechSynthesis)return;
  try{
    const u=new SpeechSynthesisUtterance('　');
    u.volume=0; u.lang='ja-JP'; u.rate=1.4;
    speechSynthesis.speak(u);
    speechOK=true;
    pickVoice();
  }catch(e){}
}
function voiceHint(t){ const e=document.getElementById('voiceNote'); if(e) e.textContent=t||''; }
function say(text){
  if(!window.speechSynthesis)return;
  unlockSpeech();
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(jaVoice)u.voice=jaVoice;
    u.lang='ja-JP'; u.rate=.95; u.pitch=1.05; u.volume=1;
    u.onstart=()=>voiceHint('');
    u.onerror=e=>{
      const er=e&&e.error;
      /* not-allowed＝タップの流れの外から喋ろうとして断られた。次のタップで開け直す。 */
      if(er==='not-allowed'||er==='interrupted'){ speechOK=false; }
      if(er==='not-allowed') voiceHint('がめんを 1かい タップしてから もういちど おしてね');
      else if(er&&er!=='canceled') voiceHint('よみあげ エラー: '+er);
    };
    speechSynthesis.speak(u);
    setTimeout(()=>{ try{ if(speechSynthesis.paused)speechSynthesis.resume(); }catch(e){} },160);
  }catch(e){}
}
/* ============ こえ（Kyokoの ろくおん ファイル） ============ */
/* タブレットの よみあげ機能（speechSynthesis）は
   ・日本語の声が入っていない
   ・タップの流れの外だと拒否される
   で鳴らないことがある。効果音と同じ Web Audio で ろくおん を鳴らすのが確実。
   ファイルが読めないとき（ローカルの file:// など）だけ よみあげ に戻す。 */
const KOE='koe/', VPRE={mushi:'m',kyoryu:'k',tokage:'t'};
const vkey=(set,i)=>VPRE[set]+String(i).padStart(2,'0');
const vbuf={}; let vSrc=[], voiceFile=null;   /* voiceFile: true=ファイル再生 / false=よみあげ */
async function vload(k){
  if(k in vbuf) return vbuf[k];
  const c=ac(); if(!c){ vbuf[k]=null; return null; }
  try{
    const r=await fetch(KOE+k+'.m4a');
    if(!r.ok) throw new Error(r.status);
    vbuf[k]=await c.decodeAudioData(await r.arrayBuffer());
  }catch(e){ vbuf[k]=null; }
  return vbuf[k];
}
function vstop(){ vSrc.forEach(s=>{ try{s.stop()}catch(e){} }); vSrc=[]; }
async function playVoice(keys,fallback){
  const c=ac();
  if(!c){ say(fallback); return; }
  /* resume() は ユーザー操作前だと ずっと保留になる。await しない。 */
  if(c.state==='suspended'){ try{ c.resume(); }catch(e){} }
  const bufs=[];
  for(const k of keys){ const b=await vload(k); if(b) bufs.push(b); }
  if(!bufs.length){ voiceFile=false; say(fallback); return; }
  voiceFile=true;
  vstop();
  let t=c.currentTime+0.03;
  for(const b of bufs){
    const src=c.createBufferSource(); src.buffer=b;
    const g=c.createGain(); g.gain.value=1;
    src.connect(g); g.connect(c.destination);
    src.start(t); t+=b.duration+0.05;
    vSrc.push(src);
  }
}
function preloadVoice(set){
  ['get','hajimete','complete','mada','test'].forEach(vload);
  for(let i=0;i<12;i++) vload(vkey(set,i));
}

let setKey='mushi', toys=[], parts=[], held=null, falling=null, target=null;

function spawn(i,x,y){
  const list=SETS[setKey].list, k=(i===undefined)?Math.floor(Math.random()*list.length):i%list.length;
  return {sp:list[k],idx:k,x:x,y:y,vx:(Math.random()-.5)*2,vy:0,rot:(Math.random()-.5)*.5,vr:0,r:R};
}
function fill(){
  toys=[]; held=null; falling=null;
  const per=Math.floor((RIGHT-LEFT)/(R*2.05));
  const n=SETS[setKey].list.length, bag=[];
  for(let q=0;q<NTOY;q++) bag.push(q%n);
  for(let q=bag.length-1;q>0;q--){const w=Math.floor(Math.random()*(q+1));[bag[q],bag[w]]=[bag[w],bag[q]];}
  let i=0,row=0;
  while(i<NTOY){
    const off=(row%2)*R*0.5;
    for(let k=0;k<per&&i<NTOY;k++,i++){
      const t=spawn(bag[i], LEFT+R+2+k*(R*2.05)+off, FLOOR-R-row*(R*1.8));
      t.vx=0; t.vy=0; t.rot=(Math.random()-.5)*.3;
      toys.push(t);
    }
    row++;
  }
  for(let s=0;s<160;s++) phys();
}
function clampAll(){
  for(const t of toys){ if(t===held||t===falling)continue;
    if(t.x<LEFT+t.r)t.x=LEFT+t.r;
    if(t.x>RIGHT-t.r)t.x=RIGHT-t.r;
    if(t.y>FLOOR-t.r)t.y=FLOOR-t.r;
    if(t.y<GY+t.r)t.y=GY+t.r; }
}
function phys(){
  for(const t of toys){ if(t===held||t===falling)continue;
    t.vy+=.55; if(t.vy>11)t.vy=11;
    t.x+=t.vx; t.y+=t.vy; t.vx*=.985; t.vy*=.99;
    t.rot+=t.vr; t.vr*=.9; t.rot*=.95;
    if(t.y>FLOOR-t.r){t.y=FLOOR-t.r;t.vy=0;t.vx*=.8;}
    t._py=t.y;
  }
  for(let it=0;it<5;it++){
    for(let i=0;i<toys.length;i++)for(let j=i+1;j<toys.length;j++){
      const a=toys[i],b=toys[j];
      if(a===held||b===held||a===falling||b===falling)continue;
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy); const m=a.r+b.r-4;
      if(d<.01){ dx=Math.random()-.5; dy=-1; d=Math.hypot(dx,dy); }
      if(d<m){ const p=(m-d)/d*.5;
        a.x-=dx*p; a.y-=dy*p; b.x+=dx*p; b.y+=dy*p;
        a.vr-=dx*.0008; b.vr+=dx*.0008; }
    }
    clampAll();
  }
  for(const t of toys){ if(t===held||t===falling)continue;
    if(t.y<t._py-.05||t.y>FLOOR-t.r-.5) t.vy=0;
    t.rot=Math.max(-.35,Math.min(.35,t.rot)); }
}
function findTarget(){
  let best=null;
  for(const t of toys){
    if(t===held||t===falling)continue;
    if(Math.abs(t.x-clawX)<TOL && (!best||t.y<best.y)) best=t;
  }
  return best;
}
function calcStop(){
  let s=FLOOR-18;
  for(const t of toys){ if(Math.abs(t.x-clawX)<t.r+8) s=Math.min(s,t.y-t.r*.55); }
  return Math.max(TOPY+40,s);
}

function loop(){

    if(holdL){ clawX-=1.2; if(frame%6===0)sTick(); }
    clawX=Math.max(LEFT+10,Math.min(RIGHT-10,clawX));

    if(open<1)open=Math.min(1,open+.08);
  }
  else if(st==='down'){ clawY+=3.4; if(clawY>=stopY){clawY=stopY;st='close';open=1;sClose();} }
  else if(st==='close'){
    open-=.055;
    if(open<=0){ open=0;
      const t=findTarget();
      if(t&&t.y-t.r<clawY+58&&t.y>clawY-30){ held=t; held.vx=0;held.vy=0;held.vr=0; setMsg('つかんだ！'); }
      else { held=null; }

  /* おもちゃ */
  for(const t of toys){
    g.save(); g.translate(t.x,t.y+t.r*0.9); g.scale(1,.35);
    g.fillStyle='rgba(90,70,130,.16)'; g.beginPath(); g.arc(0,0,t.r*.85,0,Math.PI*2); g.fill(); g.restore();
    g.save(); g.translate(t.x,t.y); g.rotate(t.rot); drawToy(g,t.sp,t.r); g.restore();
  }
  /* ねらい */
  if(st==='aim'&&target){
    g.strokeStyle='rgba(255,196,0,.95)'; g.lineWidth=5;
    g.beginPath(); g.arc(target.x,target.y,target.r*1.3,0,Math.PI*2); g.stroke();
    g.fillStyle='rgba(255,230,120,.28)'; g.beginPath(); g.arc(target.x,target.y,target.r*1.3,0,Math.PI*2); g.fill();
  }
  /* キラキラ */
  for(const p of parts){ g.globalAlpha=Math.max(0,p.life); g.fillStyle=p.c;
    g.beginPath(); g.arc(p.x,p.y,4.5,0,Math.PI*2); g.fill(); }
  g.globalAlpha=1;
  /* アーム */
  g.strokeStyle='rgba(255,255,255,.8)'; g.lineWidth=6;
  g.beginPath(); g.moveTo(GX+8,RAIL); g.lineTo(GX+GW-8,RAIL); g.stroke();
  g.strokeStyle='#8f8fb5'; g.lineWidth=4;
  g.beginPath(); g.moveTo(clawX,RAIL); g.lineTo(clawX,clawY); g.stroke();
  g.fillStyle='#ffd76a'; rr(g,clawX-24,RAIL-12,48,22,9); g.fill();
  g.fillStyle='#ffe9a8'; rr(g,clawX-26,clawY-16,52,26,10); g.fill();
  g.strokeStyle='#d9a63a'; g.lineWidth=2; rr(g,clawX-26,clawY-16,52,26,10); g.stroke();
  const sp=8+open*22;
  g.strokeStyle='#c0c4d8'; g.lineWidth=9; g.lineCap='round'; g.lineJoin='round';
  for(const s of [-1,1]){
    g.beginPath(); g.moveTo(clawX+s*12,clawY+8);
    g.quadraticCurveTo(clawX+s*sp,clawY+28,clawX+s*(sp*0.55),clawY+50);
    g.stroke();
  }
  /* ガラスの てり */
  g.fillStyle='rgba(255,255,255,.22)';
  g.beginPath(); g.moveTo(GX+30,GY); g.lineTo(GX+110,GY); g.lineTo(GX+40,GY+GH); g.lineTo(GX,GY+GH); g.closePath(); g.fill();
  g.restore();
  g.strokeStyle='#fff'; g.lineWidth=7; rr(g,GX,GY,GW,GH,16); g.stroke();
  g.strokeStyle='rgba(180,140,200,.5)'; g.lineWidth=2; rr(g,GX,GY,GW,GH,16); g.stroke();
}
/* ============ ボタン ============ */
function hold(btn,set){
  const on=e=>{e.preventDefault(); ac(); if(st==='aim'){set(true);btn.classList.add('on');}};
  const off=e=>{set(false);btn.classList.remove('on');};
  btn.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(k=>btn.addEventListener(k,off));
}
hold(document.getElementById('bR'),v=>holdR=v);
hold(document.getElementById('bL'),v=>holdL=v);
document.getElementById('bGo').addEventListener('click',()=>{
  ac(); if(st!=='aim')return;
  holdL=holdR=false; stopY=calcStop(); st='down'; setMsg('いくぞー！'); sDown();
});
document.addEventListener('keydown',e=>{
  if(document.getElementById('game').hidden)return;
  if(e.key==='ArrowRight')holdR=true; if(e.key==='ArrowLeft')holdL=true;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();document.getElementById('bGo').click();}
});
document.addEventListener('keyup',e=>{ if(e.key==='ArrowRight')holdR=false; if(e.key==='ArrowLeft')holdL=false; });

/* ============ ぜんがめん ============ */
const fsBtn=document.getElementById('fs'), exitBtn=document.getElementById('exitFs');
function fsOn(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
function syncFs(){ fsBtn.hidden=fsOn(); exitBtn.hidden=!fsOn(); setTimeout(fit,120); }
fsBtn.addEventListener('click',()=>{
  const e=document.documentElement;
  const req=e.requestFullscreen||e.webkitRequestFullscreen;
  if(!req){ setMsg('このブラウザは ぜんがめんに できません'); return; }
  Promise.resolve(req.call(e)).catch(()=>setMsg('ぜんがめんに できませんでした'));
});
exitBtn.addEventListener('click',()=>{
  const x=document.exitFullscreen||document.webkitExitFullscreen;
  if(x) Promise.resolve(x.call(document)).catch(()=>{});
});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,syncFs));
window.addEventListener('orientationchange',()=>setTimeout(fit,250));
syncFs();

/* ============ えらぶ がめん ============ */
const picks=document.getElementById('picks');
Object.keys(SETS).forEach(k=>{
  const s=SETS[k];
  const b=document.createElement('button'); b.className='pick';
  const c=document.createElement('canvas'); c.width=148;c.height=148;
  const cg=c.getContext('2d'); cg.scale(2,2); cg.translate(37,38);
  drawToy(cg,s.list[0],24);
  const tx=document.createElement('div'); tx.className='tx';
  tx.innerHTML='<b>'+s.label+'</b><span>'+s.sub+'</span>';
  b.appendChild(c); b.appendChild(tx);
  b.addEventListener('click',()=>{ac();start(k);});
  picks.appendChild(b);
});
function start(k){
  setKey=k; preloadVoice(k); fill(); clawX=LEFT+90; clawY=TOPY; open=1; st='aim'; held=null;
  document.getElementById('select').hidden=true;
  document.getElementById('game').hidden=false;
  updateCnt(); setMsg('ボタンで うごかしてね');
}
document.getElementById('back').addEventListener('click',()=>{
  document.getElementById('game').hidden=true;
  document.getElementById('select').hidden=false;
  holdL=holdR=false;
});

/* ============ ずかん ============ */
const sheet=document.getElementById('sheet'), grid=document.getElementById('grid'),
      tabs=document.getElementById('tabs'), prog=document.getElementById('prog');
let zuKey='mushi';
Object.keys(SETS).forEach(k=>{
  const b=document.createElement('button'); b.className='tab'; b.textContent=SETS[k].label;
  b.addEventListener('click',()=>{zuKey=k;preloadVoice(k);renderZu();});
  b.dataset.k=k; tabs.appendChild(b);
});
function renderZu(){
  [...tabs.children].forEach(b=>b.classList.toggle('sel',b.dataset.k===zuKey));
  const s=SETS[zuKey], have=book[zuKey];
  prog.textContent=s.label+'　'+have.length+' / '+s.list.length+' しゅるい';
  grid.innerHTML='';
  s.list.forEach((sp,i)=>{
    const got=have.includes(i);
    const b=document.createElement('button'); b.className='cell'+(got?'':' locked');
    const c=document.createElement('canvas'); c.width=140;c.height=140;
    const cg=c.getContext('2d'); cg.scale(2,2); cg.translate(35,37);
    if(got){ drawToy(cg,sp,24); }
    else{ cg.save(); cg.globalAlpha=.35; cg.fillStyle='#b6aecb';
      el(cg,0,0,28,26,0); cg.fill(); cg.restore();
      cg.fillStyle='#b6aecb'; cg.font='bold 30px sans-serif'; cg.textAlign='center'; cg.fillText('?',0,10); }
    const sn=document.createElement('span'); sn.textContent=got?sp.n:'？？？';
    b.appendChild(c); b.appendChild(sn);
    b.addEventListener('click',()=>{
      ac();
      if(got){ sSpark(); playVoice([vkey(zuKey,i)], sp.n); }
      else { sFail(); playVoice(['mada'],'まだ とってないよ'); }
    });
    grid.appendChild(b);
  });
}
document.getElementById('openZu').addEventListener('click',()=>{ ac(); zuKey=setKey; renderZu(); sheet.hidden=false; });
document.getElementById('voiceTest').addEventListener('click',()=>{
  unlockSpeech(); sSpark();
  if(!window.speechSynthesis){ voiceHint('このブラウザは よみあげに たいおうしていません'); return; }
  voiceHint('…はなしています');
  playVoice(['test'],'こんにちは。こえは きこえていますか。');
  setTimeout(()=>{ const e=document.getElementById('voiceNote');
    if(!e) return;
    if(voiceFile===true) e.textContent='ろくおんの こえで ならしました（きこえない＝本体の音量／消音スイッチ）';
    else if(voiceFile===false) e.textContent='こえファイルが よめず、ブラウザの よみあげを つかいました';
    else if(e.textContent==='…はなしています') e.textContent='おとが しないときは 本体の音量と 消音スイッチを みてね'; },2200);
});
document.getElementById('closeZu').addEventListener('click',()=>{ sheet.hidden=true; if(window.speechSynthesis)speechSynthesis.cancel(); });
sheet.addEventListener('click',e=>{ if(e.target===sheet){sheet.hidden=true;} });

/* ============ スタート ============ */
fill(); loop();
</script>
